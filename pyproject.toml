[tool.poetry]
name = "research-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Research System using LangGraph"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "agents"}, {include = "tools"}, {include = "memory"}, {include = "graph"}, {include = "output"}, {include = "api"}, {include = "observability"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
pydantic = "^2.0"
langgraph = "^0.1.0"
langchain = "^0.2.0"
langchain-core = "^0.2.0"
langchain-openai = "^0.1.0"
tavily-python = "0.7.26"
qdrant-client = "^1.5.0"
redis = "^5.0.0"
prometheus-client = "^0.17.0"
pymupdf = "^1.24.0"
beautifulsoup4 = "^4.12.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
trafilatura = "^1.8.0"
readability-lxml = "^0.8.1"
playwright = "^1.40.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.12.0"
ruff = "^0.4.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
